name: Consumer check on the registry

on:
  # Called by the publish workflow once a version is out
  workflow_call:
    inputs:
      version:
        description: Version of @msqd/lydia to install from the npm registry
        required: true
        type: string
  # For a version published by hand
  workflow_dispatch:
    inputs:
      version:
        description: Version of @msqd/lydia to install from the npm registry
        required: true
        type: string

permissions:
  contents: read

jobs:
  consumer:
    name: Consumer check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LYDIA_REGISTRY_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # The registry can lag a few seconds behind a publish
      - name: Wait for the version on the registry
        timeout-minutes: 6
        run: |
          deadline=$((SECONDS + 300))
          until npm view "@msqd/lydia@$LYDIA_REGISTRY_VERSION" version; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::@msqd/lydia@$LYDIA_REGISTRY_VERSION is not on the registry after 5 minutes"; exit 1; }
            sleep 15
          done

      - name: Check the registry copy in a fresh consumer app
        timeout-minutes: 10
        run: node test/consumer/check.mjs

name: Weekly run

# New advisories and upstream breakage between commits. Apart from run-tests.yml,
# which is also the release gates: a called workflow cannot ask for more
# permissions than its caller grants, so the issue write lives here
on:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yml

  report:
    name: Report a scheduled failure
    needs: tests
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      # One open issue at a time: a later failure comments on it
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Weekly run failed
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled run failed: $RUN_URL"
          fi

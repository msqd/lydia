name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:
  # Reused as the gates of the npm publish workflow and by the weekly run
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight; other refs run to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
          
      - name: Install dependencies
        run: make install
        
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Unit tests used to build through the `pretest` hook; `test:all` has none.
      - name: Build library
        run: make build

      - name: Check the packed package in a fresh consumer app
        timeout-minutes: 10
        run: node test/consumer/check.mjs

      # A timeout kills the step without a report; the JUnit file shows which tests ran and which hung
      - name: Run tests
        timeout-minutes: 15
        run: pnpm test:all --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-report
          path: test-results/junit.xml
          if-no-files-found: ignore
        
      - name: Run type checking
        run: make types
        
      - name: Check format and lint
        run: make check-ci

  # Weekly only, never part of the release gates: the fixture against the newest versions its ranges allow
  consumer-latest:
    name: Consumer check on the newest ranges
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: make install

      - name: Build library
        run: make build

      - name: Check the packed package against the newest ranges
        timeout-minutes: 10
        run: node test/consumer/check.mjs
        env:
          LYDIA_CONSUMER_LATEST: "1"

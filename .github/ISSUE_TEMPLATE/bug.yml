name: Bug report
description: Something does not render or behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities go through [SECURITY.md](https://github.com/msqd/lydia/blob/main/SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Lydia version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, a minimal snippet, or a Storybook story.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, Node.js and React versions.

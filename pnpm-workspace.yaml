# Dependency build scripts: run only what is needed, ignore the rest explicitly
allowBuilds:
  esbuild: true
  "@biomejs/biome": false

# Transitive fixes pinned until the parents ship them; drop each once the parent's own range allows it.
overrides:
  # postcss <=8.5.22 (several GHSA, via vite and @tailwindcss/vite)
  postcss: ">=8.5.23"
  # nanoid 3.x <3.3.18 (via postcss)
  nanoid@3: ">=3.3.18"
  # source-map-js <1.2.2 (via postcss)
  source-map-js: ">=1.2.2"
  # rollup <4.59.0 (via vite)
  rollup: ">=4.59.0"
  # picomatch 4.x <4.0.4 ReDoS (via vite, tinyglobby)
  picomatch@4: ">=4.0.4"
  # ws 8.x <8.21.0 (via Storybook and Vitest browser mode)
  ws@8: ">=8.21.0"
  # browserslist <=4.28.6 (via plugin-react and Storybook)
  browserslist: ">=4.28.7"
